="945" r="15" fill="#5B3A2E"/><text x="66" y="950.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="92" y="951" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#2E2A27" text-anchor="start" letter-spacing="1.6">FACIAL EXPRESSIONS</text><text x="386.8" y="951" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#8A8580" text-anchor="start" letter-spacing="0">· pupils, flat 2.5D lids, brow ridges and mouth · head unchanged</text><clipPath id="c0"><rect x="66.5" y="981" width="272" height="233.92"/></clipPath><g clip-path="url(#c0)"><image href="renders/expr-neutral.png" x="66.5" y="981" width="272" height="272"/></g><text x="202.5" y="1287" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2E2A27" text-anchor="middle" letter-spacing="1">01 · NEUTRAL / OBSERVANT</text><clipPath id="c1"><rect x="351.5" y="981" width="272" height="233.92"/></clipPath><g clip-path="url(#c1)"><image href="renders/expr-curious.png" x="351.5" y="981" width="272" height="272"/></g><text x="487.5" y="1287" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2E2A27" text-anchor="middle" letter-spacing="1">02 · CURIOUS</text><clipPath id="c2"><rect x="636.5" y="981" width="272" height="233.92"/></clipPath><g clip-path="url(#c2)"><image href="renders/expr-surprised.png" x="636.5" y="981" width="272" height="272"/></g><text x="772.5" y="1287" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2E2A27" text-anchor="middle" letter-spacing="1">03 · SURPRISED</text><clipPath id="c3"><rect x="921.5" y="981" width="272" height="233.92"/></clipPath><g clip-path="url(#c3)"><image href="renders/expr-happy.png" x="921.5" y="981" width="272" height="272"/></g><text x="1057.5