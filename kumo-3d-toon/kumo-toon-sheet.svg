<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1520" viewBox="0 0 2400 1520"><title>Kumo — Cel-shaded 2.5D model</title><rect width="2400" height="1520" fill="#F5F5F3"/><text x="48" y="92" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#5B3A2E" text-anchor="start" letter-spacing="4">KUMO</text><line x1="268" y1="44" x2="268" y2="104" stroke="#E2E1DD" stroke-width="2"/><text x="292" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#2E2A27" text-anchor="start" letter-spacing="2.4">CEL-SHADED 2.5D MODEL</text><text x="292" y="98" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#8A8580" text-anchor="start" letter-spacing="0">Blender model · toon shading (3 hard light bands) · dark-brown outlines · for 3D and 2D animation</text><text x="2352" y="70" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#5B3A2E" text-anchor="end" letter-spacing="0">kumo_toon.blend</text><text x="2352" y="96" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="500" fill="#8A8580" text-anchor="end" letter-spacing="0">ORTHOGRAPHIC · 1 H = HEAD HEIGHT · TOTAL 1.96 H</text><rect x="40" y="130" width="2320" height="760" rx="12" fill="#fff" stroke="#E2E1DD" stroke-width="1.5"/><circle cx="66" cy="160" r="15" fill="#5B3A2E"/><text x="66" y="165.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><text x="92" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#2E2A27" text-anchor="start" letter-spacing="1.6">TURNAROUND</text><text x="262" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#8A8580" text-anchor="start" letter-spacing="0">· same or