e="12.5" font-weight="500" fill="#2E2A27" text-anchor="start" letter-spacing="0">Iris · black vertical pupil</text><circle cx="1596" cy="1406" r="15" fill="#5B3A2E" stroke="#E2E1DD" stroke-width="1.5"/><text x="1624" y="1403" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#5B3A2E" text-anchor="start" letter-spacing="0">#5B3A2E</text><text x="1624" y="1421" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#2E2A27" text-anchor="start" letter-spacing="0">Freestyle outline</text><text x="48" y="1502" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="500" fill="#8A8580" text-anchor="start" letter-spacing="0">Built from the approved reference (referencia de modelo/). Regenerate: python kumo_toon.py --render, then node build_sheet.mjs.</text></svg>