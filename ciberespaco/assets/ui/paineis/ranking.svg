<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a0836" stop-opacity="0.94"/>
    <stop offset="1" stop-color="#0b0320" stop-opacity="0.94"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- painel com cantos chanfrados (ZodIA) -->
<path d="M26 4 H356 V404 L334 426 H4 V26 Z" fill="url(#bg)" stroke="#ff3dd8" stroke-width="5" stroke-linejoin="miter" filter="url(#glow)"/>
<path d="M36 16 H346 V396 L326 414 H16 V36 Z" fill="none" stroke="#5ee7ff" stroke-width="2" stroke-opacity="0.55"/>
<!-- trilhas de circuito no canto -->
<g fill="none" stroke="#5ee7ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
  <path d="M40 40 H90 L104 54 H140"/>
  <path d="M40 52 H72 L84 64 H110"/>
</g>
<g fill="#0b0320" stroke="#5ee7ff" stroke-width="2"><circle cx="140" cy="54" r="5"/><circle cx="110" cy="64" r="4"/></g>
<!-- placa de titulo -->
<rect x="92" y="18" width="176" height="2" fill="#ff3dd8"/>
<!-- linhas divisorias das linhas do ranking -->
<g stroke="#ff3dd8" stroke-opacity="0.35" stroke-width="2">
  <line x1="34" y1="142" x2="326" y2="142"/>
  <line x1="34" y1="202" x2="326" y2="202"/>
  <line x1="34" y1="262" x2="326" y2="262"/>
  <line x1="34" y1="322" x2="326" y2="322"/>
</g>
<!-- destaque do 1o lugar -->
<rect x="30" y="98" width="300" height="40" rx="6" fill="#ffd34d" fill-opacity="0.12" stroke="#ffd34d" stroke-opacity="0.7" stroke-width="2"/>
</svg>
